name: StockPass build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: WASM production build
        run: npx vite build --config vite.config.wasm.ts

      - name: Promote verified build to Vercel
        if: ${{ github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_T9kw5Utr35iklpAuVoKyi0EAqWcM","orgId":"team_xiDx3kTa653lWo4vl2dZw8Ag"}
          JSON
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
