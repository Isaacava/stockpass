<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2eee5" />
    <meta name="description" content="StockPass — Weekend Gap Guard for xStock collateral on Solana mainnet." />
    <title>StockPass — Weekend Gap Guard</title>
    <style>
      html,body,#root{margin:0;min-width:320px;min-height:100%;background:#f2eee5}
      .boot-fallback{min-height:100vh;display:grid;place-items:center;background:#f2eee5;color:#171717;font-family:system-ui,sans-serif}
      .boot-fallback-mark{width:42px;height:42px;display:grid;place-items:center;background:#111211;color:#fffdf8;font:800 12px/1 monospace;box-shadow:4px 4px 0 #2f46d0}
      .boot-fallback-copy{margin-top:15px;text-align:center}
      .boot-fallback-copy strong{display:block;font-size:14px}
      .boot-fallback-copy span{display:block;margin-top:6px;color:#716b62;font-size:11px}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" aria-live="polite">
        <div>
          <div class="boot-fallback-mark">SP</div>
          <div class="boot-fallback-copy"><strong>Opening StockPass</strong><span>Starting the Solana wallet workspace…</span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
