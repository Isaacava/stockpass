<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="StockPass — social proof for onchain tokenized stocks." />
    <title>StockPass — Onchain social trading</title>
    <style>
      html,body{margin:0;min-width:320px;min-height:100%;background:#f3f6f9}
      #boot-screen{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f3f6f9;color:#101827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
      #boot-screen .boot-card{width:min(520px,100%);padding:22px;border:1px solid #d9e1e9;border-radius:16px;background:#fff;box-shadow:0 18px 55px rgba(25,39,58,.08);box-sizing:border-box}
      #boot-screen .boot-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#101827;color:#fff;font-weight:800;font-size:11px;margin-bottom:16px}
      #boot-screen strong{font-size:16px}
      #boot-screen p{margin:7px 0 0;color:#6d7a8c;font-size:13px;line-height:1.6}
    </style>
  </head>
  <body>
    <div id="boot-screen">
      <div class="boot-card">
        <div class="boot-mark">SP</div>
        <strong>Loading StockPass</strong>
        <p>Preparing the mainnet social trading workspace…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
