<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2eee5" />
    <meta name="description" content="StockPass — Weekend Gap Guard for xStock collateral on Solana mainnet." />
    <title>StockPass — Weekend Gap Guard</title>
    <style>
      html,body,#root{margin:0;min-width:320px;min-height:100%;background:#f2eee5}
      .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f2eee5;color:#171717;font-family:system-ui,sans-serif}
      .boot-fallback-card{width:min(820px,100%);box-sizing:border-box;padding:28px;background:#fffdf8;border:1px solid #d7d0c3;box-shadow:8px 8px 0 #d8d0c2}
      .boot-fallback-mark{width:42px;height:42px;display:grid;place-items:center;background:#111211;color:#fffdf8;font:800 12px/1 monospace;box-shadow:4px 4px 0 #2f46d0}
      .boot-fallback-kicker{margin-top:28px;font:700 9px/1 monospace;letter-spacing:.12em;color:#716b62}
      .boot-fallback h1{margin:14px 0 0;font:800 clamp(42px,8vw,82px)/.9 Georgia,serif;letter-spacing:-.05em}
      .boot-fallback h1 span{color:#2f46d0}
      .boot-fallback p{max-width:620px;margin:18px 0 0;color:#716b62;line-height:1.7;font-size:14px}
      .boot-fallback-action{display:inline-block;margin-top:24px;padding:13px 16px;background:#111211;color:#fffdf8;border:1px solid #111211;font:700 10px/1 monospace}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="boot-fallback-card">
          <div class="boot-fallback-mark">SP</div>
          <div class="boot-fallback-kicker">STOCKPASS / WEEKEND GAP GUARD</div>
          <h1>Protect the position<br><span>before Monday.</span></h1>
          <p>Starting the Solana wallet workspace…</p>
          <span class="boot-fallback-action">Loading wallet connection</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
